name: sessions plugin

on:
  push:
    paths:
      - 'plugins/sessions/**'
      - '.github/workflows/sessions-plugin.yml'
      - '.github/annotate.py'
  pull_request:
    paths:
      - 'plugins/sessions/**'
      - '.github/workflows/sessions-plugin.yml'
      - '.github/annotate.py'
  workflow_dispatch:

permissions:
  contents: read

# Each job prints its test output and reports the result as short annotations
# (.github/annotate.py), so results can be read without downloading logs.

jobs:
  macos:
    # Two macOS pools: Apple silicon (macos-latest) is often short of capacity, so the
    # Intel image (macos-15-intel) gives macOS results even when one pool is starved.
    strategy:
      fail-fast: false
      matrix:
        image: [macos-latest, macos-15-intel]
    name: macos (${{ matrix.image }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: brew install tmux || echo "tmux not installed; tmux tests will be skipped"
      - name: Tests (Apple's /usr/bin/python3, as on a real Mac)
        shell: bash
        run: |
          /usr/bin/python3 --version
          set +e
          /usr/bin/python3 -I plugins/sessions/scripts/tests/test_sessions.py > out.txt 2>&1
          status=$?
          cat out.txt
          /usr/bin/python3 .github/annotate.py "macOS tests (${{ matrix.image }})" out.txt $status
          exit $status
      - name: Real launches (Terminal / tmux; may be blocked by the Automation permission on a runner)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          SESSIONS_LAUNCH=1 /usr/bin/python3 -I plugins/sessions/scripts/tests/test_sessions.py SessionsTests.test_real_launches > launch.txt 2>&1
          status=$?
          cat launch.txt
          /usr/bin/python3 .github/annotate.py "macOS real launches (${{ matrix.image }})" launch.txt $status
          exit $status

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        shell: bash
        run: |
          python3 --version
          set +e
          python3 -I plugins/sessions/scripts/tests/test_sessions.py > out.txt 2>&1
          status=$?
          cat out.txt
          python3 .github/annotate.py "Linux tests" out.txt $status
          exit $status

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          # Out-File -Encoding utf8 (`>` would write UTF-16 in Windows PowerShell 5.1).
          powershell -NoProfile -ExecutionPolicy Bypass -File plugins\sessions\scripts\tests\sessions.tests.ps1 | Out-File -Encoding utf8 out.txt
          $status = $LASTEXITCODE
          Get-Content out.txt
          python .github/annotate.py "Windows tests" out.txt $status
          exit $status
